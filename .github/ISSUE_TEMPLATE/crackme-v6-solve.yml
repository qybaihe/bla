name: CrackMe v6 solve
description: Submit a proof-of-solve for the public BLA-generated CrackMe v6 challenge
title: "CrackMe v6 solve: <short method>"
labels: ["crackme", "challenge"]
body:
  - type: markdown
    attributes:
      value: |
        Prove a break of [CrackMe v6](https://github.com/qybaihe/bla/tree/main/challenge/v6) by posting the **SHA-256 of the FLAG** (not necessarily the raw FLAG). It must match `flagSha256` in `challenge/v6/SEAL.json`.
  - type: dropdown
    id: stage
    attributes:
      label: Furthest stage understood
      options: [Stage A (WASM lanes), Stage B (HTML panel), Stage C (full unlock), general BLA bypass]
    validations:
      required: true
  - type: input
    id: flag_sha256
    attributes:
      label: SHA-256 of FLAG{...}
      description: Lowercase hex. Do not paste the raw FLAG unless you intend public disclosure.
      placeholder: 85df1577…
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method notes
      description: Short write-up (tooling, whether BLA layers mattered, suggested product fix).
    validations:
      required: true
  - type: checkboxes
    id: honesty
    attributes:
      label: Confirmation
      options:
        - label: I did not use a leaked maintainer secret / CI secret.
          required: true
        - label: I understand BLA does not claim immunity to interactive human RE.
          required: true
