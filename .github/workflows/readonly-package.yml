name: Read-only package

on:
  pull_request:
    branches: [main]
    paths:
      - packages/bla-readonly/**
      - src/core/release-exposure.ts
      - src/core/manifest-signature-verification.ts
      - .github/workflows/readonly-package.yml

permissions:
  contents: read

jobs:
  packed-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.23.4' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '26' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/bla-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/bla-readonly/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:pack
