name: Release bla-agents

# Tag-only releases. Do not publish on plain main pushes.
on:
  push:
    tags:
      - "bla-agents-*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected release version (must match package.json / tag)"
        required: false
        default: ""
        type: string

concurrency:
  group: release-bla-agents
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify release tarballs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Verify release ref and tag
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version in package.json"
            exit 1
          fi
          TAG="bla-agents-${VERSION}"
          if [[ -n "$DISPATCH_VERSION" ]]; then
            EXPECTED_VERSION="${DISPATCH_VERSION#v}"
            EXPECTED_VERSION="${EXPECTED_VERSION#bla-agents-}"
            if [[ "$EXPECTED_VERSION" != "$VERSION" ]]; then
              echo "::error::workflow_dispatch version does not match package.json version $VERSION"
              exit 1
            fi
          fi

          if [[ "$TRIGGER_REF" == refs/tags/* ]]; then
            if [[ "$TRIGGER_REF" != "refs/tags/$TAG" && "$TRIGGER_REF" != "refs/tags/v$VERSION" ]]; then
              echo "::error::Trigger tag does not match package.json version $VERSION"
              exit 1
            fi
          elif [[ "$TRIGGER_EVENT" != workflow_dispatch ]]; then
            echo "::error::Release workflow only runs on version tags or workflow_dispatch"
            exit 1
          fi

          EXISTING_TAG_SHA=""
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            EXISTING_TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [[ "$EXISTING_TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "::error::Tag $TAG points to $EXISTING_TAG_SHA instead of $HEAD_SHA"
              exit 1
            fi
          fi
          {
            echo "version=$VERSION"
            echo "head_sha=$HEAD_SHA"
            echo "existing_tag_sha=$EXISTING_TAG_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run full verification gates (typecheck, build, test, benchmark)
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm test
          npm run benchmark

      - name: Pack primary and alias release tarballs and verify consistency
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGER_REF: ${{ github.ref }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
          EXISTING_TAG_SHA: ${{ steps.release.outputs.existing_tag_sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { BLA_IDENTITY } from "./dist/identity.js";
            import { packDualReleaseTarballs, verifyReleaseConsistency } from "./dist/core/release-plan.js";
            const pkg = JSON.parse(readFileSync("./package.json", "utf8"));
            const packed = packDualReleaseTarballs(process.cwd(), "./release-assets");
            const plan = verifyReleaseConsistency({
              packageVersion: pkg.version,
              identityVersion: BLA_IDENTITY.version,
              dispatchVersion: process.env.DISPATCH_VERSION || null,
              triggerRef: process.env.TRIGGER_REF || null,
              headSha: process.env.HEAD_SHA,
              existingTagSha: process.env.EXISTING_TAG_SHA || null,
              tarballSha256: packed.primary.sha256,
              aliasTarballSha256: packed.alias.sha256,
            });
            console.log("Release plan verified:", JSON.stringify(plan, null, 2));
          '
          (cd release-assets && sha256sum --check --strict SHA256SUMS.txt)

      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish verified release tarballs
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build-and-verify.outputs.version }}
      HEAD_SHA: ${{ needs.build-and-verify.outputs.head_sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true

      - name: Check downloaded tarballs
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt
          test -f "bla-agents-${VERSION}.tgz"
          test -f "bla-shield-${VERSION}.tgz"

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Create or verify the remote canonical tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bla-agents-${VERSION}"
          REF="refs/tags/${TAG}"
          remote_tag_sha() {
            # An annotated tag lists its tag object and its peeled commit.
            git ls-remote --tags "${GITHUB_SERVER_URL}/${GH_REPO}.git" "$REF" "${REF}^{}" |
              awk -v ref="$REF" '$2 == ref {tag = $1} $2 == ref "^{}" {peeled = $1} END {print (peeled ? peeled : tag)}'
          }

          REMOTE_SHA=$(remote_tag_sha)
          if [[ -z "$REMOTE_SHA" ]]; then
            gh api --method POST "repos/${GH_REPO}/git/refs" -f ref="$REF" -f sha="$HEAD_SHA" --silent
            REMOTE_SHA=$(remote_tag_sha)
          fi
          if [[ "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::Remote tag $TAG points to '${REMOTE_SHA}', expected $HEAD_SHA"
            exit 1
          fi

      - name: Publish bla-agents tarball to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE="bla-agents@${VERSION}"
          PRIMARY_TGZ="./release-assets/bla-agents-${VERSION}.tgz"
          EXPECTED_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$PRIMARY_TGZ" | openssl base64 -A)"

          if METADATA=$(npm view "$PACKAGE" dist.integrity --json --prefer-online); then
            if ! jq -e --arg expected "$EXPECTED_INTEGRITY" '. == $expected' <<< "$METADATA" >/dev/null; then
              echo "::error::Published $PACKAGE dist.integrity differs from the verified tarball"
              exit 1
            fi
            echo "$PACKAGE is already published with matching integrity."
          elif jq -e '.error.code == "E404"' <<< "$METADATA" >/dev/null; then
            npm publish "$PRIMARY_TGZ" --ignore-scripts --provenance --access public
          else
            echo "::error::Could not retrieve dist.integrity for $PACKAGE"
            exit 1
          fi

      - name: Reconcile GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bla-agents-${VERSION}"
          ASSETS=("release-assets/bla-agents-${VERSION}.tgz" "release-assets/bla-shield-${VERSION}.tgz" "release-assets/SHA256SUMS.txt")
          if EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name'); then
            MISSING=()
            for ASSET in "${ASSETS[@]}"; do
              NAME=${ASSET##*/}
              if grep -Fxq -- "$NAME" <<< "$EXISTING"; then
                gh release download "$TAG" --pattern "$NAME" --output - | cmp - "$ASSET"
              else
                MISSING+=("$ASSET")
              fi
            done
            if (( ${#MISSING[@]} > 0 )); then
              gh release upload "$TAG" "${MISSING[@]}"
            fi
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "bla-agents: v${VERSION}" \
              --generate-notes
          fi
