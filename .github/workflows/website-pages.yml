name: Website Check

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/verify-website.mjs"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

jobs:
  check-website:
    name: Verify website HTML, assets & links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify required files, internal links and Content-Security-Policy
        run: node scripts/verify-website.mjs
