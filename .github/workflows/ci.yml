name: CI

on:
  push:
    branches: [main]
  # Validate stacked fixes as well as pull requests targeting main.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pin the minimum as well as current patches to prevent runtime-floor drift.
        node-version: [22.13.0, 22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run automated test suite
        run: npm test

      - name: Run Counter-REA benchmark suite
        run: node dist/cli.js benchmark
